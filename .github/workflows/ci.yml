# CI: lint + unit/integration tests on every push and pull request.
# No build step (this app has none). HTML/CSS are not Prettier-formatted
# (see .prettierignore) so operators keep the existing layout files stable.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: lint + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Test
        run: npm test
